spring.application.name=project-ai901

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:project_ai901}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:app}
spring.datasource.password=${DB_PASSWORD:app}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.config.import=optional:file:./.env[.properties]

# --- Storage de archivos ---
app.storage.type=${APP_STORAGE_TYPE:local}
app.storage.local.base-path=${APP_STORAGE_LOCAL_PATH:./data/storage}
app.storage.azure.connection-string=${AZURE_STORAGE_CONNECTION_STRING:}
app.storage.azure.container=${AZURE_STORAGE_CONTAINER:uploads}

# --- Azure AI Document Intelligence ---
app.ai.di.provider=${APP_DI_PROVIDER:mock}
app.ai.di.endpoint=${AZURE_DOC_INTELLIGENCE_ENDPOINT:}
app.ai.di.key=${AZURE_DOC_INTELLIGENCE_KEY:}
