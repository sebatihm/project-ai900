spring.application.name=project-ai901

# Carga opcional del .env local (KEY=VALUE) para desarrollo
spring.config.import=optional:file:./.env[.properties]

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:project_ai901}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:app}
spring.datasource.password=${DB_PASSWORD:app}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR

spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=14MB

# --- Seguridad / JWT ---
# Si JWT_SECRET queda vacio se genera un secreto efimero al arrancar (tokens invalidados al reiniciar)
app.security.jwt.secret=${JWT_SECRET:}
app.security.jwt.expiration=${JWT_EXPIRATION:PT8H}

# --- Storage de archivos ---
app.storage.type=${APP_STORAGE_TYPE:local}
app.storage.local.base-path=${APP_STORAGE_LOCAL_PATH:./data/storage}
app.storage.azure.connection-string=${AZURE_STORAGE_CONNECTION_STRING:}
app.storage.container.in=${AZURE_STORAGE_CONTAINER_IN:facturas-entrada}
app.storage.container.valid=${AZURE_STORAGE_CONTAINER_VALID:facturas-validas}
app.storage.container.quarantine=${AZURE_STORAGE_CONTAINER_QUARANTINE:facturas-cuarentena}
app.storage.sas-ttl=PT10M

foundry.project-endpoint=${AZURE_OPENAI_ENDPOINT}
foundry.agent_name=${AZURE_OPENAI_AGENT_NAME}
foundry.deployment=${AZURE_OPENAI_DEPLOYMENT}
foundry.agent.publish=true
# útil para ver en consola qué herramientas pide el modelo
logging.level.org.springframework.ai=DEBUG

# --- Azure AI Document Intelligence ---
app.ai.di.provider=${APP_DI_PROVIDER:mock}
app.ai.di.endpoint=${AZURE_DOC_INTELLIGENCE_ENDPOINT:}
app.ai.di.key=${AZURE_DOC_INTELLIGENCE_KEY:}
app.ai.di.mock.mode=${APP_DI_MOCK_MODE:sample}

# --- Reglas de facturas ---
app.invoice.max-size-bytes=10485760
app.invoice.allowed-extensions=pdf,jpg,jpeg,png
app.invoice.max-pages=5
app.invoice.min-image-width=800
app.invoice.min-image-height=600
app.invoice.old-days=90
app.invoice.total-tolerance=0.01
app.invoice.high-score=3
app.invoice.low-confidence=0.80
app.invoice.score.logical-duplicate=3
app.invoice.score.missing-fields=2
app.invoice.score.low-confidence=1
app.invoice.score.supplier-mismatch=2
app.invoice.score.total-inconsistent=2
app.invoice.score.odd-date=1
app.invoice.score.atypical-amount=1
