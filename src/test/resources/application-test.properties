# Configuracion de pruebas: base de datos en memoria H2 (modo MySQL)
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER,VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Secreto JWT fijo para las pruebas (nunca se usa fuera del entorno de test)
app.security.jwt.secret=clave-secreta-de-pruebas-para-el-modulo-de-usuarios-ai901
app.security.jwt.expiration=PT1H

# Analizador publico de facturas
app.frontend.base-url=http://frontend.test
app.public-upload.key=test-public-upload-key
